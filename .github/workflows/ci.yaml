name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
          
      - name: Build
        run: |
          cmake -B build
          cmake --build build -j$(nproc)
          
      - name: Run evaluate_test
        run: |
          ./build/evaluate_test
